name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P TestPassword123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/Internshala.Domain.Tests/Internshala.Domain.Tests.csproj --no-build -c Release
          dotnet test tests/Internshala.Application.Tests/Internshala.Application.Tests.csproj --no-build -c Release

      - name: Integration tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=InternshalaTest;User Id=SA;Password=TestPassword123!;TrustServerCertificate=True"
          Jwt__SecretKey: "test-secret-key-for-ci-minimum-32-characters"
        run: dotnet test tests/Internshala.IntegrationTests/Internshala.IntegrationTests.csproj --no-build -c Release

      - name: Publish
        run: dotnet publish Internshala.API/Internshala.API.csproj -c Release -o ./publish --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish-${{ github.sha }}
          path: backend/publish/
          retention-days: 7
