version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: internshala-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "DevPassword123!"
      MSSQL_DB: "InternshalaDb"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "DevPassword123!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: internshala-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: internshala-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  seq:
    image: datalust/seq:latest
    container_name: internshala-seq
    ports:
      - "5341:5341"
      - "5342:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
